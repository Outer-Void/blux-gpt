name: CI

on:
  push:
    branches: ["main", "stage-*/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Lint and types
        run: |
          ruff format --check .
          ruff check .
          mypy
      - name: Tests (mocked providers; real-provider tests skip without BLUXGPT_REAL_PROVIDERS=1)
        run: pytest
      - name: Offline self-check
        env:
          BLUXGPT_ROUTES: bluxgpt/data/mock-routes.json
          BLUXGPT_HISTORY: "0"
        run: |
          bluxgpt check
          bluxgpt ask "ci" --json > /dev/null
