[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bluxgpt"
version = "2.0.0"
description = "BluxGPT: the provider gateway behind the BLUX Model API (transport, retries, streaming, normalization) and an advisory CLI."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Outer-Void" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
bluxgpt = "bluxgpt.cli:main"

[tool.setuptools.packages.find]
include = ["bluxgpt*"]

[tool.setuptools.package-data]
bluxgpt = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["real: calls real providers (needs credentials and BLUXGPT_REAL_PROVIDERS=1)"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF", "SIM", "C4"]
ignore = ["S101", "S310", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "BLE"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["bluxgpt"]
